# Render Blueprint: static site at https://valmor-resiste.onrender.com (served from the root, so BASE_PATH is /).
services:
  - type: web
    runtime: static
    name: valmor-resiste
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: BASE_PATH
        value: /
      - key: NODE_VERSION
        value: 22
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
