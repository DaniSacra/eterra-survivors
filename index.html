    <style>
      /* Pixel UI font (Jersey 15, SIL OFL 1.1, public/fonts/Jersey15-OFL.txt): Portuguese accents included. */
      @font-face {
        font-family: 'Jersey 15';
        src: url('%BASE_URL%fonts/Jersey15.ttf') format('truetype');
        font-weight: 400 700;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100vw;
        height: 100dvh;
      }
      canvas {
        display: block;
      }
      /* Probe read by render/ui.ts safeArea(): notches and rounded corners on phones. */
      #safe-area {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
    </style>
