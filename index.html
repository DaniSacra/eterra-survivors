<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d14" />
    <title>Valmor Resiste</title>
    <link rel="manifest" href="/eterra-survivors/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/eterra-survivors/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Eterra" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161a26'/%3E%3Cpath d='M16 4 26 13 16 28 6 13Z' fill='%233ed4ff' stroke='%230b0d14' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpath d='M16 4 20 13 16 28 12 13Z M6 13H26' fill='none' stroke='%23d4f8ff' stroke-width='1.2' opacity='.8'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100vw;
        height: 100dvh;
      }
      canvas {
        display: block;
      }
      /* Probe read by render/ui.ts safeArea(): notches and rounded corners on phones. */
      #safe-area {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
          env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="safe-area"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
