<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d14" />
    <title>Eterra Survivors</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d14;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        width: 100vw;
        height: 100dvh;
      }
      canvas {
        display: block;
      }
      /* Probe read by render/ui.ts safeArea(): notches and rounded corners on phones. */
      #safe-area {
        position: fixed;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
          env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <div id="safe-area"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
